<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AETHER Fx — The Little Light</title>
    <style>
        :root {
            font-family: system-ui, sans-serif;
            color: #3f354d;
            background: #f7f1e8
        }

        body {
            margin: 0;
            padding: 32px
        }

        main {
            max-width: 1280px;
            margin: auto
        }

        h1 {
            font-size: 22px;
            margin: 0 0 8px
        }

        p {
            color: #766674;
            margin: 0 0 24px
        }

        .stage {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 16px 60px #49354d22
        }

        canvas {
            display: block;
            width: 100%;
            height: auto
        }

        nav {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 20px;
            flex-wrap: wrap
        }

        button,
        select {
            font: inherit;
            border: 1px solid #d3c4b8;
            border-radius: 8px;
            background: #fffaf1;
            color: #3f354d;
            padding: 10px 18px;
            cursor: pointer
        }

        button:disabled {
            opacity: .5
        }

        input {
            flex: 1;
            min-width: 180px;
            accent-color: #588f91
        }

        output {
            font-variant-numeric: tabular-nums;
            min-width: 126px
        }

        #status {
            margin-top: 16px;
            font-size: 14px
        }

        a {
            color: #315f68
        }
    </style>
</head>

<body>
    <main>
        <h1>AETHER Fx · The Little Light</h1>
        <p>A twenty-second illustrated short. Play with sound, or seek directly to any of its 480 frames.</p>
        <div class="stage"><canvas width="1280" height="720" aria-label="The Little Light animated short"></canvas>
        </div>
        <nav><button id="play" disabled>Play with sound</button><button id="pause" disabled>Pause</button><input
                id="seek" type="range" min="0" max="479" value="0" aria-label="Frame"><output id="frame">Frame 0 /
                479</output><select id="rate" aria-label="Playback speed">
                <option value="0.5">0.5×</option>
                <option value="1" selected>1×</option>
                <option value="2">2×</option>
            </select></nav>
        <p id="status" role="status">Loading declared assets…</p>
    </main>
    <script type="module" src="/main.js"></script>
</body>

</html>
